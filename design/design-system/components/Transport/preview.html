<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Transport</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div class="pf-transport" style="width:100%">
<button class="pf-play" aria-label="Play"><i class="pf-i " data-i="play" data-solid></i></button>
<span class="pf-timecode">1:05.12 <span>/ 3:12.00</span></span>
<span class="pf-sep"></span>
<button class="pf-track-chip"><i class="pf-i pf-i--sm" data-i="music"></i><span>demo-track.wav</span><i class="pf-i pf-i--sm" data-i="chevron-down"></i></button>
<span class="pf-badge pf-badge--outline">128 BPM</span>
<span class="pf-spacer"></span>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-pressed="true" aria-label="Loop the export section"><i class="pf-i " data-i="repeat"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Mute"><i class="pf-i " data-i="volume"></i></button>
<span class="pf-sep"></span>
<button class="pf-btn pf-btn--ghost pf-btn--icon pf-btn--sm" aria-label="Zoom out"><i class="pf-i " data-i="minus"></i></button>
<span class="pf-timecode" style="font-size:12px">4x</span>
<button class="pf-btn pf-btn--ghost pf-btn--icon pf-btn--sm" aria-label="Zoom in"><i class="pf-i " data-i="plus"></i></button>
</div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
