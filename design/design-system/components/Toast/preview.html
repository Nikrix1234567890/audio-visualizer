<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo ">
<div class="pf-toast pf-toast--success"><i class="pf-i " data-i="check"></i>Project saved</div>
