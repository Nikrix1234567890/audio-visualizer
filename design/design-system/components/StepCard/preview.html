<html lang="en">
<head><meta charset="utf-8"><title>StepCard</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo ">
<div class="pf-card pf-grow"><span class="pf-step__num">Step 1</span><h3 class="pf-card__title">Load a track</h3><p class="pf-card__text">Drop in any song. It is analysed once, right in your browser.</p></div>
<div class="pf-card pf-grow"><span class="pf-step__num">Step 2</span><h3 class="pf-card__title">Build the scene</h3><p class="pf-card__text">Start from a template. Add elements and wire any setting to the music.</p></div>
<div class="pf-card pf-grow"><span class="pf-step__num">Step 3</span><h3 class="pf-card__title">Export the video</h3><p class="pf-card__text">Pick a format and press Export. It looks exactly like the preview.</p></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
