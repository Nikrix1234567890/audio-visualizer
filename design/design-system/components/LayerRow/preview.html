<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LayerRow</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--panel">
<div class="pf-layers" role="listbox" aria-label="Scene" style="width:288px">
<div class="pf-layer" role="option" aria-selected="true"><span class="pf-layer__grip"><i class="pf-i pf-i--sm" data-i="grip"></i></span><span class="pf-layer__thumb" style="background-image:url(/_blob/03f8ecb7fb8ab934724f3814ef03689b)"></span><span class="pf-layer__name">Galaxy</span><span class="pf-layer__sigs"><span class="pf-dot" data-sig="bass" title="Reacts to bass"></span><span class="pf-dot" data-sig="beat" title="Reacts to beat"></span></span><button class="pf-layer__btn" aria-label="Show or hide"><i class="pf-i " data-i="eye"></i></button><button class="pf-layer__btn" aria-label="More"><i class="pf-i " data-i="more"></i></button></div>
<div class="pf-layer" role="option"><span class="pf-layer__grip"><i class="pf-i pf-i--sm" data-i="grip"></i></span><span class="pf-layer__thumb" style="background-image:url(/_blob/b1842b2dee006177bd1c37dd5e12d775)"></span><span class="pf-layer__name">Track title</span><span class="pf-layer__sigs"><span class="pf-dot" data-sig="level" title="Reacts to level"></span></span><button class="pf-layer__btn" aria-label="Show or hide"><i class="pf-i " data-i="eye"></i></button><button class="pf-layer__btn" aria-label="More"><i class="pf-i " data-i="more"></i></button></div>
<div class="pf-layer" role="option"><span class="pf-layer__grip"><i class="pf-i pf-i--sm" data-i="grip"></i></span><span class="pf-layer__thumb" style="background-image:url(/_blob/8e7bc2ea9c6c31af084cdeaef63b91ea)"></span><span class="pf-layer__name">Bar ring</span><span class="pf-layer__sigs"><span class="pf-dot" data-sig="bass" title="Reacts to bass"></span><span class="pf-dot" data-sig="mid" title="Reacts to mid"></span><span class="pf-dot" data-sig="high" title="Reacts to high"></span></span><button class="pf-layer__btn" aria-label="Show or hide"><i class="pf-i " data-i="eye"></i></button><button class="pf-layer__btn" aria-label="More"><i class="pf-i " data-i="more"></i></button></div>
<div class="pf-layer" role="option" data-hidden><span class="pf-layer__grip"><i class="pf-i pf-i--sm" data-i="grip"></i></span><span class="pf-layer__thumb" style="background-image:url(/_blob/6621542129cd5d7b24416bac088ea4f6)"></span><span class="pf-layer__name">Glowing core</span><span class="pf-layer__sigs"><span class="pf-dot" data-sig="beat" title="Reacts to beat"></span></span><button class="pf-layer__btn" aria-label="Show or hide"><i class="pf-i " data-i="eye-off"></i></button><button class="pf-layer__btn" aria-label="More"><i class="pf-i " data-i="more"></i></button></div>
<div class="pf-layer" role="option"><span class="pf-layer__grip"><i class="pf-i pf-i--sm" data-i="grip"></i></span><span class="pf-layer__thumb" style="background-image:url(/_blob/4fc9e9379949205ec35fd43c4fe765df)"></span><span class="pf-layer__name">Stars</span><span class="pf-layer__sigs"></span><button class="pf-layer__btn" aria-label="Show or hide"><i class="pf-i " data-i="eye"></i></button><button class="pf-layer__btn" aria-label="More"><i class="pf-i " data-i="more"></i></button></div></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
