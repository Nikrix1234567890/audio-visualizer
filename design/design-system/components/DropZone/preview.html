<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DropZone</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div class="pf-row" style="align-items:stretch">
<div class="pf-drop pf-grow"><span class="pf-drop__icon"><i class="pf-i pf-i--lg" data-i="music"></i></span><span class="pf-drop__title">Drop a track here</span><span class="pf-drop__hint">MP3, WAV, M4A, AAC, OGG or FLAC</span>
<span class="pf-row" style="justify-content:center"><button class="pf-btn pf-btn--cta">Choose a file</button><button class="pf-btn pf-btn--secondary">Use the demo track</button></span></div>
<div class="pf-drop pf-grow" data-over><span class="pf-drop__icon"><i class="pf-i pf-i--lg" data-i="download"></i></span><span class="pf-drop__title">Let go to load it</span><span class="pf-drop__hint">night-drive-master.wav</span></div></div>
<div class="pf-drop pf-drop--inline"><span class="pf-drop__icon"><i class="pf-i " data-i="image"></i></span><span class="pf-stack" style="gap:2px"><span class="ui-strong">Add your logo or cover art</span><span class="pf-drop__hint">PNG, JPG or WebP, up to 10 MB</span></span></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
