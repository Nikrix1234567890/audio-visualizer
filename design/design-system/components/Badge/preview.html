<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div class="pf-row">
<span class="pf-badge">Free</span>
<span class="pf-badge pf-badge--premium"><i class="pf-i " data-i="crown"></i>Premium</span>
<span class="pf-badge pf-badge--accent"><span class="pf-badge__dot pf-badge__dot--live"></span>Rendering 42%</span>
<span class="pf-badge pf-badge--outline">Queued · 2nd</span>
<span class="pf-badge pf-badge--success"><i class="pf-i " data-i="check"></i>Done</span>
<span class="pf-badge pf-badge--warning"><i class="pf-i " data-i="alert"></i>Unsaved</span>
<span class="pf-badge pf-badge--danger"><i class="pf-i " data-i="x"></i>Failed</span>
<span class="pf-badge pf-badge--outline">128 BPM</span></div>
<div class="pf-row"><span class="pf-badge pf-badge--lg"><span class="pf-badge__dot" style="color:var(--accent)"></span>No install. Free to try.</span></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
