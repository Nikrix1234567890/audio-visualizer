<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rail</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo ">
<div style="display:flex;height:312px;border:1px solid var(--line-1);border-radius:var(--radius-lg);overflow:hidden">
<nav class="pf-rail" aria-label="Library">
<button class="pf-rail__item" aria-selected="true"><i class="pf-i " data-i="grid"></i>Templates</button>
<button class="pf-rail__item"><i class="pf-i " data-i="box"></i>Elements</button>
<button class="pf-rail__item"><i class="pf-i " data-i="image"></i>Media</button>
<button class="pf-rail__item"><i class="pf-i " data-i="type"></i>Text</button>
<button class="pf-rail__item"><i class="pf-i " data-i="droplet"></i>Palettes</button>
<span class="pf-rail__spacer"></span>
<button class="pf-rail__item"><i class="pf-i " data-i="help"></i>Help</button></nav>
<div style="width:232px;background:var(--bg-2);padding:12px" class="pf-stack"><span class="ui-strong">Templates</span><span class="pf-note">The library panel for the selected rail item opens here. Clicking the selected item again closes the panel and gives the stage the room.</span></div></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
