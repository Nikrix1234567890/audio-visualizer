<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Section</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--stage">
<div class="pf-panel" style="width:320px">
<div class="pf-section"><button class="pf-section__head"><i class="pf-i pf-i--sm" data-i="chevron-down"></i>Shape<span class="pf-section__actions"><span class="pf-btn pf-btn--ghost pf-btn--icon pf-btn--sm" title="Reset section"><i class="pf-i pf-i--sm" data-i="rotate"></i></span></span></button>
<div class="pf-section__body"><div class="pf-param"><div class="pf-scrub" role="slider" tabindex="0" aria-label="Radius" style="--v:0.48"><span class="pf-scrub__label">Radius</span><span class="pf-scrub__value">2.40<small>m</small></span></div><button class="pf-jack" aria-label="React to audio"></button><button class="pf-key" aria-label="Animate over time"></button></div><div class="pf-param"><div class="pf-scrub" role="slider" tabindex="0" aria-label="Bar height" style="--v:0.42"><span class="pf-scrub__label">Bar height</span><span class="pf-scrub__value">1.25<small>x</small></span><span class="pf-scrub__mod" data-sig="bass" style="--m:0.3"></span></div><button class="pf-jack" data-sig="bass" aria-label="Reacts to bass"></button><button class="pf-key" aria-label="Animate over time"></button></div><div class="pf-param"><div class="pf-scrub" role="slider" tabindex="0" aria-label="Bars" style="--v:0.38"><span class="pf-scrub__label">Bars</span><span class="pf-scrub__value">96</span></div><span class="pf-param__lock" title="Counts cannot react or animate"><i class="pf-i pf-i--sm" data-i="lock"></i></span><span style="width:16px"></span></div></div></div>
<div class="pf-section"><button class="pf-section__head"><i class="pf-i pf-i--sm" data-i="chevron-down"></i>Colour</button>
<div class="pf-section__body"><button class="pf-color" style="--c:#ff4fa3"><span class="pf-color__chip"></span><span class="pf-color__label">Colour</span><span class="pf-color__hex">#FF4FA3</span></button></div></div>
<div class="pf-section" data-collapsed><button class="pf-section__head"><i class="pf-i pf-i--sm" data-i="chevron-down"></i>Position, rotation, scale</button><div class="pf-section__body"></div></div>
<div class="pf-section" data-collapsed><button class="pf-section__head"><i class="pf-i pf-i--sm" data-i="chevron-down"></i>Tempo</button><div class="pf-section__body"></div></div></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
