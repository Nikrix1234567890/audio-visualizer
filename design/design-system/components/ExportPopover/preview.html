<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ExportPopover</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--stage">
<div class="pf-popover pf-stack" style="gap:12px">
<div class="title">Export video</div>
<div class="pf-field"><span class="pf-label">Format</span><div class="pf-seg pf-seg--block" role="group"><button class="pf-seg__item" aria-pressed="false">16:9</button><button class="pf-seg__item" aria-pressed="true">9:16</button><button class="pf-seg__item" aria-pressed="false">1:1</button></div></div>
<div class="pf-field"><span class="pf-label">Resolution</span><div class="pf-seg pf-seg--block" role="group"><button class="pf-seg__item" aria-pressed="true">720p</button><button class="pf-seg__item" aria-pressed="false" data-locked>1080p<i class="pf-i " data-i="lock"></i></button><button class="pf-seg__item" aria-pressed="false" data-locked>1440p<i class="pf-i " data-i="lock"></i></button><button class="pf-seg__item" aria-pressed="false" data-locked>4K<i class="pf-i " data-i="lock"></i></button></div></div>
<div class="pf-field"><span class="pf-label">Frame rate</span><div class="pf-seg pf-seg--block" role="group"><button class="pf-seg__item" aria-pressed="true">30 fps</button><button class="pf-seg__item" aria-pressed="false" data-locked>60 fps<i class="pf-i " data-i="lock"></i></button></div></div>
<div class="pf-field"><span class="pf-label">Length</span><div class="pf-seg pf-seg--block" role="group"><button class="pf-seg__item" aria-pressed="false">Whole track</button><button class="pf-seg__item" aria-pressed="false">15 s</button><button class="pf-seg__item" aria-pressed="true">30 s</button><button class="pf-seg__item" aria-pressed="false">60 s</button></div></div>
<div class="pf-banner pf-banner--premium"><i class="pf-i " data-i="crown"></i><span><b>1080p to 4K, 60 fps, no watermark.</b> Premium unlocks them.</span></div>
<div class="pf-row" style="justify-content:space-between"><span class="pf-note">720 x 1280 · 0:30 · about 1 min</span>
<button class="pf-btn pf-btn--cta"><i class="pf-i " data-i="download"></i>Export</button></div></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
