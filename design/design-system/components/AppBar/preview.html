<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AppBar</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div style="display:flex;align-items:center;gap:8px;width:100%;height:48px;padding:0 12px;border-bottom:1px solid var(--line-1);background:var(--bg-2)">
<span class="pf-logo"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="9" cy="9" r="3"/><circle cx="24" cy="9" r="5"/><circle cx="39" cy="9" r="3"/><circle cx="9" cy="24" r="5"/><circle cx="24" cy="24" r="8"/><circle cx="39" cy="24" r="5"/><circle cx="9" cy="39" r="3"/><circle cx="24" cy="39" r="5"/><circle cx="39" cy="39" r="3"/></svg></span><span class="pf-sep"></span>
<input class="pf-input pf-input--bare" style="width:180px" value="Night drive visual" aria-label="Project title">
<span class="pf-badge pf-badge--success"><i class="pf-i " data-i="check"></i>Saved</span>
<span class="pf-spacer"></span>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Undo"><i class="pf-i " data-i="undo"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Redo" disabled><i class="pf-i " data-i="redo"></i></button>
<span class="pf-sep"></span>
<div class="pf-seg" role="group"><button class="pf-seg__item" aria-pressed="true">16:9</button><button class="pf-seg__item" aria-pressed="false">9:16</button><button class="pf-seg__item" aria-pressed="false">1:1</button></div>
<span class="pf-spacer"></span>
<span class="pf-badge">Free</span>
<button class="pf-btn pf-btn--ghost"><i class="pf-i " data-i="share"></i>Share</button>
<button class="pf-btn pf-btn--cta"><i class="pf-i " data-i="download"></i>Export</button>
<span class="pf-avatar">NZ</span></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
