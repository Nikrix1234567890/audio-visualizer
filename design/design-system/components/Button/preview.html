<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div class="pf-row">
<button class="pf-btn pf-btn--cta"><i class="pf-i " data-i="download"></i>Export</button>
<button class="pf-btn pf-btn--accent">Add keyframe</button>
<button class="pf-btn pf-btn--secondary">Save project</button>
<button class="pf-btn pf-btn--ghost"><i class="pf-i " data-i="share"></i>Share</button>
<button class="pf-btn pf-btn--premium"><i class="pf-i " data-i="crown"></i>Upgrade</button>
<button class="pf-btn pf-btn--danger"><i class="pf-i " data-i="trash"></i>Delete project</button></div>
<div class="pf-row">
<button class="pf-btn pf-btn--cta pf-btn--xl">Start with your track<i class="pf-i " data-i="arrow-right"></i></button>
<button class="pf-btn pf-btn--secondary pf-btn--xl">Browse templates</button>
<button class="pf-btn pf-btn--cta pf-btn--lg">Create account</button>
<button class="pf-btn pf-btn--secondary pf-btn--sm"><i class="pf-i pf-i--sm" data-i="plus"></i>Add</button></div>
<div class="pf-row">
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Undo"><i class="pf-i " data-i="undo"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-pressed="true" aria-label="Loop"><i class="pf-i " data-i="repeat"></i></button>
<button class="pf-btn pf-btn--secondary pf-btn--icon" aria-label="More"><i class="pf-i " data-i="more"></i></button>
<button class="pf-btn pf-btn--cta" aria-busy="true">Export</button>
<button class="pf-btn pf-btn--secondary" disabled>Save project</button></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
