<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stage</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap"></head>
<body class="pf-demo pf-demo--col">
<div class="pf-stage" style="height:372px;padding:56px 32px 24px">
<div class="pf-toolbar" style="position:absolute;top:12px;left:50%;transform:translateX(-50%)">
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-pressed="true" aria-label="Select"><i class="pf-i " data-i="cursor"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Move"><i class="pf-i " data-i="move"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Rotate"><i class="pf-i " data-i="rotate"></i></button>
<button class="pf-btn pf-btn--ghost pf-btn--icon" aria-label="Scale"><i class="pf-i " data-i="scale"></i></button>
<span class="pf-sep"></span>
<button class="pf-btn pf-btn--ghost pf-btn--sm">Fit<i class="pf-i pf-i--sm" data-i="chevron-down"></i></button></div>
<span class="pf-timecode" style="position:absolute;top:20px;right:16px;font-size:11px;color:var(--ink-3)">60 fps</span>
<div class="pf-frame" style="width:auto;height:100%;background-image:url(/_blob/03f8ecb7fb8ab934724f3814ef03689b)"><span class="pf-frame__tl"><span class="pf-badge pf-badge--solid">16:9</span><span class="pf-badge pf-badge--solid">720p</span></span><span class="pf-frame__br">Beatframe</span></div></div>
<script>window.Pulsefield && window.Pulsefield.mount();</script>
</body>
</html>
